name: Deploy to Production

on:
  push:
    branches: [ "develop" ] # Срабатывает только при пуше в ветку develop

jobs:
  deploy:
    runs-on: self-hosted # Указываем, что задача должна идти на наш сервер

    steps:
      - name: Pull latest changes
        run: |
          cd /opt/attestation_streamlit
          git fetch origin develop
          git reset --hard origin/develop
      
      - name: Fix Permissions
        run: |
          sudo chmod -R 777 /opt/attestation_streamlit/protocols
          sudo chmod -R 777 /opt/attestation_streamlit/uploads
          sudo chmod -R 777 /opt/attestation_streamlit/templates
          
      - name: Install dependencies (if changed)
        run: |
          cd /opt/attestation_streamlit
          ./venv/bin/pip install -r requirements.txt

      - name: Restart Streamlit Service
        run: |
          sudo systemctl restart attestation-streamlit